<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FocusMate AI — an adaptive study and productivity management system for students.">
  <meta name="theme-color" content="#09090b">
  <title>FocusMate AI — Adaptive Study Workspace</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          colors: {
            accent: '#6d6af8'
          }
        }
      }
    };
  </script>

  <!-- Custom design system -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" role="main"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true" style="pointer-events:none;"></div>
  <script type="module" src="js/app.js"></script>

</body>
</html>
